<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Matcha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/" class="logo">Matcha</a>
            <button class="navbar-toggler" onclick="toggleMenu()">
                <i class="fa fa-bars"></i>
            </button>
        </div>
        <ul class="navbar-menu" id="navbarMenu">
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/chat">Messages</a></li>
            <li><a href="/settings">Settings</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div id="chatContainer" class="chat-container">
        <div class="chat-sidebar">
            <!-- <h3>Messages</h3> -->
            <ul id="chatList" class="chat-list">
                <!-- <li class="chat-item">John Doe</li>
                <li class="chat-item">Jane Smith</li>
                <li class="chat-item">Michael Brown</li> -->
            </ul>
        </div>
        <div class="chat-box">
            <div class="chat-header">
                <!-- <h3>John Doe</h3> -->
            </div>
            <div class="chat-messages">
                <!-- <div class="message received">Hey, how are you?</div>
                <div class="message sent">I'm good, what about you?</div> -->
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Type a message...">
                <button id="button"><i class="fa fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</body>

</html>

<script type="module">
    let myUid;
    let currentRoomID;

    function toggleMenu() {
        document.getElementById("navbarMenu").classList.toggle("show");
    }

    let inputMessage = document.querySelector(".chat-input input");
    let chatMessages = document.querySelector(".chat-messages");
    let chatList = document.getElementById("chatList");
    let chatContainer = document.getElementById("chatContainer");


    /**************************************   Add all chat   **************************************/
    function getNameByID(id, chatItem) {
        // console.log('getNameByID');
        fetch("/getUserByID", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                uid: id
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log("getNameByID: ", data);
                // console.log("data: ", data);
                chatItem.innerHTML = data.user.prenom;
                // return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    async function getChatRoomParticipants(chatRoomID, chatItem) {
        await fetch("/getChatRoomParticipants", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chatRoomID: chatRoomID
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(async (data) => {
                // console.log('participants:', data);
                // renvoie l'id du participants qui n'est pas moi
                // console.log('my uid:', myUid);
                // console.log('participants:', data.participants);
                if (data.participants[0] == myUid) {
                    // console.log('participants:', data.participants[1]);
                    // console.log("send: ", data.participants[1]);
                    getNameByID(data.participants[1], chatItem);
                }
                // console.log('send:', data.participants[0]);
                // console.log("beacause myUid: ", myUid);
                getNameByID(data.participants[0], chatItem);
                // return data.participants[0];
                // console.log('participants:', participants);
                // return participants;
                // return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    async function displayChatList(data) {
        // console.log('debut chat list: ', data.user.chatRoomID);
        chatList.innerHTML = "";

        if (!data.user.chatRoomID) {
            let chatItem = document.createElement("li");
            chatItem.classList.add("chat-item");
            chatItem.textContent = "No chat rooms found";
            chatList.appendChild(chatItem);
            chatContainer
                .querySelector(".chat-box")
                .querySelector(".chat-header")
                .textContent = "No chat rooms found";
            chatContainer
                .querySelector(".chat-messages")
                .innerHTML = "";
            chatContainer
                .querySelector(".chat-input input")
                .setAttribute("disabled", true);
            chatContainer
                .querySelector(".chat-input button")
                .setAttribute("disabled", true);
            return;
        }

        for (let id of data.user.chatRoomID) {
            // console.log("id = ", id);
            // console.log("username = ", username);
            let chatItem = document.createElement("li");
            await getChatRoomParticipants(id, chatItem);
            // ajoute l'id de la room dans la class
            chatItem.classList.add(id);
            // chatItem.classList.add(chatRoomID);
            chatItem.classList.add("chat-item");
            // console.log(chatItem.classList);
            chatItem.addEventListener("click", () => {
                loadChatMessages(chatItem.classList[0]);
                chatItem.classList.remove('unread');
                // scroll jusqu'en bas de la div chat-messages
                chatMessages.scrollBottom = chatMessages.scrollHeight;
            });
            chatList.appendChild(chatItem);
        }
    }

    function loadChatList() {
        fetch("/getMyChatRoom", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                displayChatList(data);
                // return (data);
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    async function getCookie() {
        return new Promise(async (resolve) => {
            const result = await fetch("/getCookie")
            resolve((await (await result.json()).find((val) => { return val.Name === "uid" })).Value);
        })
    }

    function addToDb(message) {
        console.log('addToDb, message:', message);
        console.log('addToDb, currentRoomID:', currentRoomID);
        console.log('addToDb, myUid:', myUid);
        fetch("/sendMessage", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                chatRoom: currentRoomID,
                userID: myUid
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // The message is already added via SSE, no need to add it again here
                // console.log("Message sent successfully:", data);

                // Clear input field
                inputMessage.value = "";
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    function addMessage() {
        let message = inputMessage.value;
        message = message.trim();
        if (message) {
            let messageDiv = document.createElement("div");
            messageDiv.classList.add("message", "sent");
            messageDiv.textContent = message;
            chatMessages.appendChild(messageDiv);
            inputMessage.value = "";
        }
    }

    inputMessage.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            let message = inputMessage.value;
            if (message) {
                // addMessage();
                addToDb(message);
            }
        }
    });

    let button = document.getElementById("button");
    button.addEventListener("click", addToDb);

    /**************************************   Display chat message   **************************************/

    function displayChatMessages(data) {
        // console.log('displayChatMessages, data:', data);
        chatMessages.innerHTML = "";
        if (!data.messages)
            return;
        data.messages.forEach(element => {
            // console.log('element:', element);
            let messageDiv = document.createElement("div");
            messageDiv.classList.add("message");
            if (element.userID == myUid) {
                messageDiv.classList.add("sent");
            } else {
                messageDiv.classList.add("received");
            }
            messageDiv.textContent = element.message;
            // ajoute le message en haut de chatMessages
            chatMessages.prepend(messageDiv);
            // chatMessages.appendChild(messageDiv);
        });
    }

    function getRoomID() {
        return chatContainer.querySelector(".chat-header").textContent;
    }

    function loadChatMessages(roomID) {
        currentRoomID = roomID;

        // const chatItem = document.querySelector(`.chat-item.${roomID}`);
        // if (chatItem) {
        //     chatItem.classList.remove('unread');
        // }

        // Connect to SSE for this room
        connectToSSE(roomID);
        fetch("/getMessages", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chatRoom: roomID
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                currentRoomID = roomID;
                displayChatMessages(data);
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    /**************************************   Create chat room   **************************************/

    function getAllChatRooms() {
        fetch("/getAllChatRooms", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    function createChatRoom() {
        let users = [1, 2];
        let roomName = "test";

        fetch("/createChatRoom", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_ids: users,
                name: roomName
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    /**************************************   Sse   **************************************/
    let eventSource;

    function connectToSSE(roomID) {
        console.log('Connecting to SSE for room:', roomID);
        // Close any existing connection
        if (eventSource) {
            eventSource.close();
        }

        // Connect to SSE endpoint
        eventSource = new EventSource(`/sse?roomID=${roomID}`);

        // Handle incoming messages
        eventSource.onmessage = function (event) {
            console.log('Received SSE message:', event.data);
            const messageData = JSON.parse(event.data);

            let messageDiv = document.createElement("div");
            messageDiv.classList.add("message");
            if (messageData.userID == myUid) {
                messageDiv.classList.add("sent");
            } else {
                messageDiv.classList.add("received");
            }
            messageDiv.textContent = messageData.message;

            // Add to chat
            chatMessages.prepend(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        eventSource.onerror = function (error) {
            console.error('SSE Error:', error);
            eventSource.close();
            // Try to reconnect after a delay
            setTimeout(() => connectToSSE(roomID), 5000);
        };
    }

    let notificationEventSource;

    function connectToNotifications() {
        // Fermer toute connexion existante
        if (notificationEventSource) {
            notificationEventSource.close();
        }

        // Établir une nouvelle connexion
        notificationEventSource = new EventSource('/notifications');

        // Gérer les notifications entrantes
        notificationEventSource.onmessage = function (event) {
            console.log('Notification reçue:', event.data);
            const notificationData = JSON.parse(event.data);

            // Si c'est une notification de nouveau message
            if (notificationData.type === 'new_message') {
                // Si l'utilisateur n'est pas dans cette chatroom, afficher une notification
                if (currentRoomID != notificationData.roomID) {
                    // Trouver l'élément de la chatroom dans la liste et le mettre en surbrillance
                    // const chatItem = document.querySelector(`.chat-item.${notificationData.roomID}`);
                    // if (chatItem) {
                    //     chatItem.classList.add('unread');

                    //     // Vous pourriez aussi jouer un son de notification
                    //     const notificationSound = new Audio('/notification.mp3');
                    //     notificationSound.play();

                    //     // Afficher une notification dans le navigateur
                    //     if (Notification.permission === 'granted') {
                    //         new Notification('Nouveau message', {
                    //             body: `Nouveau message dans la conversation`,
                    //             icon: '/images/icon.png'
                    //         });
                    //     }
                    // }
                    // console.log('chatList:', chatList);
                    chatList.childNodes.forEach(element => {
                        if (element.classList[0] == notificationData.roomID) {
                            element.classList.add('unread');
                        }
                    });
                }
            }
        };

        notificationEventSource.onerror = function (error) {
            console.error('Erreur de connexion aux notifications:', error);
            notificationEventSource.close();
            // Essayer de se reconnecter après un délai
            setTimeout(connectToNotifications, 5000);
        };
    }

    // Se déconnecter lors de la fermeture de la page
    function disconnectNotifications() {
        if (notificationEventSource) {
            notificationEventSource.close();
            notificationEventSource = null;
        }
    }

    window.addEventListener('beforeunload', disconnectNotifications);

    // Demander la permission pour les notifications du navigateur
    function requestNotificationPermission() {
        if (Notification && Notification.permission !== 'granted') {
            Notification.requestPermission();
        }
    }

    // Appeler cette fonction au chargement du document
    document.addEventListener("DOMContentLoaded", async function () {
        myUid = await getCookie();
        requestNotificationPermission();
        connectToNotifications();

        // createChatRoom();
        // console.log("chat.js loaded");
        loadChatList();
        // console.log(chatList);
        // displayChatList(chatList);
    });
</script>

    }

        top: 0;

        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
    }

    .navbar-brand {
        display: flex;
        align-items: center;
    }

    .navbar-brand .logo {
        font-size: 1.5rem;
        font-weight: bold;
        color: #ff6b6b;
        text-decoration: none;
    }

    .navbar-toggler {
        background: none;

    }

    }

    /* Responsive */
    @media (max-width: 768px) {

        }

        .navbar-menu {
            display: none;
            flex-direction: column;
            width: 100%;
            background: white;
            position: absolute;
            top: 100%;
            left: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 10px 0;
        }

        .navbar-menu.show {
            display: flex;
        }

        .navbar-menu li {
            text-align: center;
            margin: 10px 0;
        }
    }

    .chat-container {
        display: flex;
        height: 95vh;
        margin-top: 5vh;
    }

    .chat-sidebar {
        width: 25%;
        background: #343a40;
        color: white;
        padding: 20px;
    }

    .chat-list {
        list-style: none;

    .chat-list .chat-item:hover {

    }

        padding: 10px;
        border-bottom: 1px solid #495057;

    }

    .chat-box {
        width: 75%;
        /* display: flex; */
        flex-direction: column;
        background: white;
        padding: 20px;
    }

    .chat-header {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .chat-messages {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ddd;
        background: #fff;
        display: flex;
        flex-direction: column-reverse;
        height: 90%;
    }

    .message {
        padding: 10px;
        margin: 5px 0;
        border-radius: 10px;
        max-width: 40%;
    }

    .received {
        display: flex;
        background: #f1f1f1;
        align-self: flex-start;
    }

    .sent {
        display: flex;
        background: #ff6b6b;
        color: white;
        align-self: flex-end;
    }

    .chat-input {
        display: flex;
        border-top: 1px solid #ddd;
        padding: 10px;
    }

    .chat-input input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    .chat-input button {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
    }

    .chat-item.unread {
        font-weight: bold;
        background-color: rgba(255, 107, 107, 0.2);
        position: relative;
    }

    .chat-item.unread::after {
        content: '';
        position: absolute;
        top: 10px;
        right: 10px;
        width: 10px;
        height: 10px;
        background-color: #ff6b6b;
        border-radius: 50%;
    }
</style>
