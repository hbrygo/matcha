<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Matcha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/" class="logo">Matcha</a>
            <button class="navbar-toggler" onclick="toggleMenu()">
                <i class="fa fa-bars"></i>
            </button>
        </div>
        <ul class="navbar-menu" id="navbarMenu">
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/chat">Messages</a></li>
            <li><a href="/settings">Settings</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div id="chatContainer" class="chat-container">
        <div class="chat-sidebar">
            <!-- <h3>Messages</h3> -->
            <ul id="chatList" class="chat-list">
                <!-- <li class="chat-item">John Doe</li>
                <li class="chat-item">Jane Smith</li>
                <li class="chat-item">Michael Brown</li> -->
            </ul>
        </div>
        <div class="chat-box">
            <div class="chat-header">
                <!-- <h3>John Doe</h3> -->
            </div>
            <div class="chat-messages">
                <!-- <div class="message received">Hey, how are you?</div>
                <div class="message sent">I'm good, what about you?</div> -->
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Type a message...">
                <button id="button"><i class="fa fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</body>

</html>

<script type="module">
    let myUid;

    function toggleMenu() {
        document.getElementById("navbarMenu").classList.toggle("show");
    }

    let inputMessage = document.querySelector(".chat-input input");
    let chatMessages = document.querySelector(".chat-messages");
    let chatList = document.getElementById("chatList");
    let chatContainer = document.getElementById("chatContainer");


    /**************************************   Add all chat   **************************************/
    function getNameByID(id, chatItem) {
        console.log('getNameByID');
        fetch("/getUserByID", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                uid: id
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log("getNameByID: ", data);
                console.log("data: ", data);
                chatItem.innerHTML = data.user.prenom;
                // return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    async function getChatRoomParticipants(chatRoomID, chatItem) {
        await fetch("/getChatRoomParticipants", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chatRoomID: chatRoomID
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(async (data) => {
                // console.log('participants:', data);
                // renvoie l'id du participants qui n'est pas moi
                // console.log('my uid:', myUid);
                // console.log('participants:', data.participants);
                if (data.participants[0] == myUid) {
                    // console.log('participants:', data.participants[1]);
                    // console.log("send: ", data.participants[1]);
                    getNameByID(data.participants[1], chatItem);
                }
                // console.log('send:', data.participants[0]);
                // console.log("beacause myUid: ", myUid);
                getNameByID(data.participants[0], chatItem);
                // return data.participants[0];
                // console.log('participants:', participants);
                // return participants;
                // return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    async function displayChatList(data) {
        console.log('debut chat list: ', data.user.chatRoomID);
        chatList.innerHTML = "";

        if (!data.user.chatRoomID) {
            let chatItem = document.createElement("li");
            chatItem.classList.add("chat-item");
            chatItem.textContent = "No chat rooms found";
            chatList.appendChild(chatItem);
            chatContainer
                .querySelector(".chat-box")
                .querySelector(".chat-header")
                .textContent = "No chat rooms found";
            chatContainer
                .querySelector(".chat-messages")
                .innerHTML = "";
            chatContainer
                .querySelector(".chat-input input")
                .setAttribute("disabled", true);
            chatContainer
                .querySelector(".chat-input button")
                .setAttribute("disabled", true);
            return;
        }

        for (let id of data.user.chatRoomID) {
            // console.log("id = ", id);
            // console.log("username = ", username);
            let chatItem = document.createElement("li");
            await getChatRoomParticipants(id, chatItem);
            // ajoute l'id de la room dans la class
            chatItem.classList.add(id);
            // chatItem.classList.add(chatRoomID);
            chatItem.classList.add("chat-item");
            // console.log(chatItem.classList);
            chatItem.addEventListener("click", () => { loadChatMessages(chatItem.classList[0]) });
            chatList.appendChild(chatItem);
        }
    }

    function loadChatList() {
        fetch("/getMyChatRoom", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                displayChatList(data);
                // return (data);
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    async function getCookie() {
        return new Promise(async (resolve) => {
            const result = await fetch("/getCookie")
            // .then(response => response.json())
            // .then(data => {
            //     // console.log("data: ", data);
            //     // ajoute le uid dans le cookie
            //     // document.cookie = `uid=${data.uid}`;
            //     console.log('data: ', data);
            //     return data.find(val => val.Name === 'uid').Value;
            // });
            resolve((await (await result.json()).find((val) => { return val.Name === "uid" })).Value);
        })
    }

    function addToDb(message) {
        let xhr = new XMLHttpRequest();
        xhr.open("POST", "/sendMessage", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                console.log(xhr.responseText);
            }
        };
        let uid = document.cookie['uid'];
        let roonID = getRoomID();
        xhr.send(JSON.stringify({
            message: message,
            chatRoom: roonID,
            userID: uID
        }));
    }

    function addMessage() {
        let message = inputMessage.value;
        message = message.trim();
        if (message) {
            let messageDiv = document.createElement("div");
            messageDiv.classList.add("message", "sent");
            messageDiv.textContent = message;
            chatMessages.appendChild(messageDiv);
            inputMessage.value = "";
        }
    }

    inputMessage.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            let message = inputMessage.value;
            if (message) {
                addMessage();
                addToDb(message);
            }
        }
    });

    let button = document.getElementById("button");
    button.addEventListener("click", addMessage);

    /**************************************   Display chat message   **************************************/

    function displayChatMessages(data) {
        // console.log('displayChatMessages, data:', data);
        chatMessages.innerHTML = "";
        if (!data.message)
            return;
        data.forEach(message => {
            let messageDiv = document.createElement("div");
            messageDiv.classList.add("message", message.sender === document.cookie['uid'] ? "sent" : "received");
            messageDiv.textContent = message.message;
            chatMessages.appendChild(messageDiv);
        });
    }

    function getRoomID() {
        return chatContainer.querySelector(".chat-header").textContent;
    }

    function loadChatMessages(roomID) {
        fetch("/getMessages", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chatRoom: roomID
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                displayChatMessages(data);
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    /**************************************   Create chat room   **************************************/

    function getAllChatRooms() {
        fetch("/getAllChatRooms", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    function createChatRoom() {
        let users = [1, 2];
        let roomName = "test";

        fetch("/createChatRoom", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_ids: users,
                name: roomName
            })
        })
            .then(response => {
                // console.log(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                // console.log(data);
                return data;
            })
            .catch(error => {
                console.error("There has been a problem with your fetch operation:", error);
            });
    }

    document.addEventListener("DOMContentLoaded", async function () {
        myUid = await getCookie();
        // console.log('myUid:', myUid);
        // console.log('chat room created');
        // createChatRoom();
        // console.log("chat.js loaded");
        loadChatList();
        // console.log(chatList);
        // displayChatList(chatList);
    });
</script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
    }

    .navbar-brand {
        display: flex;
        align-items: center;
    }

    .navbar-brand .logo {
        font-size: 1.5rem;
        font-weight: bold;
        color: #ff6b6b;
        text-decoration: none;
    }

    .navbar-toggler {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        display: none;
    }

    .navbar-menu {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .navbar-menu li {
        margin: 0 1rem;
    }

    .navbar-menu a {
        color: #333;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .navbar-menu a:hover {
        color: #ff6b6b;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .navbar-toggler {
            display: block;
        }

        .navbar-menu {
            display: none;
            flex-direction: column;
            width: 100%;
            background: white;
            position: absolute;
            top: 100%;
            left: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 10px 0;
        }

        .navbar-menu.show {
            display: flex;
        }

        .navbar-menu li {
            text-align: center;
            margin: 10px 0;
        }
    }

    .chat-container {
        display: flex;
        height: 95vh;
        margin-top: 5vh;
    }

    .chat-sidebar {
        width: 25%;
        background: #343a40;
        color: white;
        padding: 20px;
    }

    .chat-list {
        list-style: none;
        padding: 0;
    }

    .chat-list .chat-item:hover {
        background: #495057;
    }

    .chat-item {
        padding: 10px;
        border-bottom: 1px solid #495057;
        cursor: pointer;
    }

    .chat-box {
        width: 75%;
        /* display: flex; */
        flex-direction: column;
        background: white;
        padding: 20px;
    }

    .chat-header {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .chat-messages {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ddd;
        background: #fff;
        display: flex;
        flex-direction: column;
        height: 90%;
    }

    .message {
        padding: 10px;
        margin: 5px 0;
        border-radius: 10px;
        max-width: 40%;
    }

    .received {
        display: flex;
        background: #f1f1f1;
        align-self: flex-start;
    }

    .sent {
        display: flex;
        background: #ff6b6b;
        color: white;
        align-self: flex-end;
    }

    .chat-input {
        display: flex;
        border-top: 1px solid #ddd;
        padding: 10px;
    }

    .chat-input input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    .chat-input button {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
    }
</style>
